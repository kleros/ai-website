[build]
  publish = "."

[[redirects]]
  from = "/proof"
  to = "/our-solutions"
  status = 301
  force = true

# --- Canonical URL collapse --------------------------------------------------
# Netlify serves both /page and /page.html with a 200 and no redirect either
# way, so every page had at least two live URLs. The extensionless form is
# canonical: it is the Netlify idiom, and it is already what /proof targets —
# canonicalising on .html instead would have turned that into a two-hop chain.
#
# force = true is REQUIRED. Netlify skips any redirect whose `from` matches an
# existing static file, and every one of these does.
#
# No loop: the rule matches the REQUEST path. When the browser then asks for
# /our-solutions, Netlify resolves our-solutions.html through asset lookup
# without re-entering the redirect engine, and no rule has that `from`.
# Verify on a deploy preview anyway — a 301 on an extensionless form means a
# loop, and the fix is to delete that one rule (the canonical tags already
# solve the duplicate-content problem on their own).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/our-solutions.html"
  to = "/our-solutions"
  status = 301
  force = true

[[redirects]]
  from = "/builders.html"
  to = "/builders"
  status = 301
  force = true

# The A/B variants are unlinked and noindex, but each declares an extensionless
# canonical, so the .html form redirects to it for consistency. Their addresses
# are otherwise unchanged — they are still reached by pasted direct URL.
[[redirects]]
  from = "/products.html"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/products-b.html"
  to = "/products-b"
  status = 301
  force = true

[[redirects]]
  from = "/products-c.html"
  to = "/products-c"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # RFC 8288. Two registered relations; there is no registered rel for agent
    # skills, MCP, AI or LLM, and RFC 8288 forbids unregistered bare tokens (a
    # custom relation must be a full URI, which nothing would parse).
    #   service-desc (RFC 8631) — machine-consumable service description.
    #   describedby  (RFC 6892) — a resource providing information about this one.
    # NOT rel="alternate" for llms.txt: that would assert llms.txt is another
    # representation *of this page*, which is false — it is a site-wide index.
    # Reserve alternate;type=text/markdown for a real per-page .md twin.
    # NOT rel="sitemap": not in the IANA registry. Sitemap discovery is via
    # robots.txt only.
    # Honest expectation: nothing in the wild reads these for discovery today.
    Link = '''</.well-known/agent-skills/index.json>; rel="service-desc"; type="application/json", </llms.txt>; rel="describedby"; type="text/markdown"'''

# --- Discovery files ---------------------------------------------------------
# robots.txt (text/plain) and sitemap.xml (application/xml) need no rule —
# Netlify's defaults are already correct. llms.txt would default to text/plain;
# skills.kleros.io serves its own as text/markdown, so match the sibling.
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# The publish dir is the repo root, so these are public URLs. They are
# reference material, not pages. noindex rather than a robots.txt Disallow: a
# disallowed URL is never fetched, so this header would never be read, and the
# URL could still surface in search from an external link.
[[headers]]
  for = "/README.md"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/scripts/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The card is content-addressed by filename — a revision ships as
# og-card-2.png rather than overwriting — so it can be cached hard.
[[headers]]
  for = "/og-card.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Agent Skills discovery (RFC v0.2.0) -------------------------------------
# The conventional well-known path serves the same bytes as the canonical URL,
# so the single digest in index.json validates at either location.
#
# One block per skill, by design. Generalise to
#   from = "/.well-known/agent-skills/:skill/SKILL.md"  ->  to = "/:skill/skill.md"
# (plus the matching [[headers]] rule) when a THIRD skill lands — a placeholder
# rule cannot be verified against a skill that does not exist yet, and adding a
# second skill already means editing index.json and re-running
# scripts/update-digests.js in the same sitting.
[[redirects]]
  from = "/.well-known/agent-skills/agentkit-onboarding/SKILL.md"
  to = "/agentkit-onboarding/skill.md"
  status = 200

[[headers]]
  for = "/.well-known/agent-skills/index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/agentkit-onboarding/skill.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/agent-skills/agentkit-onboarding/SKILL.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"
